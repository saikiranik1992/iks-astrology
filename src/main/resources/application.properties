# ===================================================================
# IK's Astrology - Spring Boot + Thymeleaf Configuration
# ===================================================================
spring.application.name=iks-astrology
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# Thymeleaf Template Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Custom Application Metadata injected into Thymeleaf
# (Uses standard Java \uXXXX Unicode escapes so ISO-8859-1 .properties readers never garble Tamil characters)
app.title=\u2728 IK\u2019s Astrology
app.subtitle=\u0BA8\u0BB5\u0B95\u0BBF\u0BB0\u0B95 \u0BA4\u0BB2\u0B99\u0BCD\u0B95\u0BB3\u0BCD & \u0B95\u0BBE\u0BAF\u0BA4\u0BCD\u0BB0\u0BBF \u0BAE\u0BA8\u0BCD\u0BA4\u0BBF\u0BB0\u0BAE\u0BCD \u2022 12 \u0BAA\u0BBE\u0BB5\u0B95 \u0BAA\u0BB2\u0BA9\u0BCD \u2022 \u0B85\u0BB7\u0BCD\u0B9F\u0B95\u0BB5\u0BB0\u0BCD\u0B95\u0BCD\u0B95\u0BAE\u0BCD (337) \u2022 \u0BA4\u0B9A\u0BBE \u0BAA\u0BC1\u0BA4\u0BCD\u0BA4\u0BBF \u2022 \u0BAA\u0B9E\u0BCD\u0B9A\u0BBE\u0B99\u0BCD\u0B95\u0BAE\u0BCD & \u0B93\u0BB0\u0BC8\u0B95\u0BB3\u0BCD \u2022 10 \u0BAA\u0BCA\u0BB0\u0BC1\u0BA4\u0BCD\u0BA4\u0BAE\u0BCD
app.stepBadge=IK\u2019s Astrology \u2022 Spring Boot + Thymeleaf Modern Suite

# ExactPredictions Pro integration. Set this ONLY in the OS/hosting environment.
exactpredictions.api-key=${EXACT_PREDICTIONS_API_KEY:}

